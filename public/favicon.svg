<!-- Browser-tab icon: the same one-pip die as the top-bar mark in app/logo.tsx.
     Two deliberate differences, both for legibility at 16px: the die is inset by
     3 units instead of 2 so its corners survive the browser's own rounding, and
     the pip is drawn slightly larger, because at tab size the mark's radius from
     the header would shrink to under 2px and read as dirt on the glass. -->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="18" y1="4" x2="46" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0705f"/>
      <stop offset="0.45" stop-color="#e2564a"/>
      <stop offset="1" stop-color="#c8443c"/>
    </linearGradient>
    <radialGradient id="pip" cx="0.4" cy="0.32" r="0.8">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e2dc"/>
    </radialGradient>
    <linearGradient id="edge" x1="32" y1="3" x2="32" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <path d="M32 3c11.1 0 16.7 0 21.1 2.4a16.4 16.4 0 0 1 5.5 5.5C61 15.3 61 20.9 61 32s0 16.7-2.4 21.1a16.4 16.4 0 0 1-5.5 5.5C48.7 61 43.1 61 32 61s-16.7 0-21.1-2.4a16.4 16.4 0 0 1-5.5-5.5C3 48.7 3 43.1 3 32s0-16.7 2.4-21.1a16.4 16.4 0 0 1 5.5-5.5C15.3 3 20.9 3 32 3Z" fill="url(#body)"/>
  <path d="M32 3c11.1 0 16.7 0 21.1 2.4a16.4 16.4 0 0 1 5.5 5.5C61 15.3 61 20.9 61 32s0 16.7-2.4 21.1a16.4 16.4 0 0 1-5.5 5.5C48.7 61 43.1 61 32 61s-16.7 0-21.1-2.4a16.4 16.4 0 0 1-5.5-5.5C3 48.7 3 43.1 3 32s0-16.7 2.4-21.1a16.4 16.4 0 0 1 5.5-5.5C15.3 3 20.9 3 32 3Z" stroke="url(#edge)" stroke-width="1.6"/>
  <circle cx="32" cy="33" r="8" fill="#000000" opacity="0.13"/>
  <circle cx="32" cy="32" r="8" fill="url(#pip)"/>
</svg>
